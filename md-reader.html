<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD Reader</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; height: 100vh; background: #f5f6f8; color: #24292f; }
.sidebar { width: 320px; height: 100vh; background: #fff; border-right: 1px solid #e1e4e8; overflow: hidden; padding: 0 16px 14px; flex-shrink: 0; display: flex; flex-direction: column; }
.sidebar-header { position: sticky; top: 0; z-index: 2; background: #fff; padding: 20px 0 4px; box-shadow: 0 8px 12px rgba(255,255,255,.95); }
.sidebar-title-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.sidebar h1 { font-size: 18px; color: #24292f; }
.sidebar-close-btn { width: 28px; height: 28px; border: 0; border-radius: 6px; background: #f6f8fa; color: #57606a; font-size: 18px; line-height: 1; cursor: pointer; flex-shrink: 0; }
.sidebar-close-btn:hover { background: #eaeef2; color: #cf222e; }
.open-btn { width: 100%; padding: 10px; background: #0969da; color: #fff; border: 0; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 12px; }
.open-btn:hover { background: #0b5fbf; }
.open-actions { display: flex; gap: 8px; margin-bottom: 12px; }
.open-actions .open-btn { flex: 1; width: auto; margin-bottom: 0; padding: 10px 8px; }
.open-file-btn { background: #57606a; }
.open-file-btn:hover { background: #424a53; }
.file-input { display: none; }
.search-input { width: 100%; padding: 9px 10px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 14px; margin-bottom: 12px; outline: none; }
.search-input:focus { border-color: #0969da; box-shadow: 0 0 0 3px rgba(9,105,218,.12); }
.current-path { font-size: 13px; color: #57606a; word-break: break-all; margin-bottom: 0; padding: 6px 8px; background: #f6f8fa; border-radius: 6px; display: none; align-items: center; justify-content: space-between; gap: 8px; }
.root-toggle { flex: 1; min-width: 0; cursor: pointer; user-select: none; font-weight: 600; }
.root-toggle::before { content: '▾'; display: inline-block; width: 14px; margin-right: 4px; transition: transform .15s ease; }
.root-toggle.collapsed::before { transform: rotate(-90deg); }
.remove-root { border: 0; background: transparent; color: #57606a; font-size: 16px; line-height: 1; cursor: pointer; padding: 2px 4px; border-radius: 4px; flex-shrink: 0; }
.remove-root:hover { background: #eaeef2; color: #cf222e; }
.tree { list-style: none; flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 10px; }
.tree.collapsed { display: none; }
.tree li { margin: 2px 0; }
.tree .root-item.dragging { opacity: .55; }
.tree .root-item.drop-before { border-top: 3px solid #0969da; padding-top: 3px; }
.tree .root-item.drop-after { border-bottom: 3px solid #0969da; padding-bottom: 3px; }
.tree .root-row { font-size: 13px; color: #57606a; word-break: break-all; margin: 8px 0 4px; padding: 6px 8px; background: #f6f8fa; border-radius: 6px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tree .root-row.selected { background: #e7f2ff; color: #075985; border: 1px solid #b6d7f5; }
.tree .single-file-row a { flex: 1; min-width: 0; }
.tree a { color: #24292f; text-decoration: none; font-size: 14px; display: block; padding: 4px 8px; border-radius: 6px; cursor: pointer; }
.tree a:hover { background: #f0f1f3; }
.tree a.active { background: #0969da; color: #fff; }
.tree .folder { font-weight: 600; padding: 4px 8px; color: #57606a; font-size: 13px; text-transform: uppercase; letter-spacing: .03em; user-select: none; cursor: pointer; border-radius: 6px; }
.tree .folder:hover { background: #f0f1f3; }
.tree .folder.selected-parent { background: #eaeef2; color: #424a53; }
.tree .folder::before { content: '▾'; display: inline-block; width: 14px; margin-right: 4px; transition: transform .15s ease; }
.tree .folder.collapsed::before { transform: rotate(-90deg); }
.tree .children { list-style: none; padding-left: 14px; border-left: 1px solid #e1e4e8; margin-left: 10px; }
.tree .children.collapsed { display: none; }
.tree .file-icon { opacity: .7; margin-right: 4px; }
.developer-credit { color: #57606a; font-size: 12px; text-align: center; background: #fff; border-top: 1px solid #e1e4e8; padding-top: 10px; flex-shrink: 0; }
.main { flex: 1; overflow-y: auto; padding: 32px 40px; }
.empty { color: #57606a; font-size: 16px; max-width: 600px; }
.error { color: #cf222e; background: #ffebe9; border: 1px solid #ffcecb; padding: 12px 16px; border-radius: 6px; font-size: 14px; word-break: break-all; }
.hint { font-size: 13px; color: #57606a; margin-top: 12px; line-height: 1.6; }
.loading { color: #57606a; background: #fff; border: 1px solid #e1e4e8; border-radius: 8px; padding: 24px 28px; display: inline-flex; align-items: center; gap: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
.spinner { width: 18px; height: 18px; border: 3px solid #d0d7de; border-top-color: #0969da; border-radius: 50%; animation: spin .75s linear infinite; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }
.markdown { width: 100%; background: #fff; border: 1px solid #e1e4e8; border-radius: 8px; padding: 32px 40px; box-shadow: 0 1px 3px rgba(0,0,0,.04); line-height: 1.7; }
.markdown h1, .markdown h2, .markdown h3, .markdown h4 { margin: 28px 0 14px; line-height: 1.25; }
.markdown h1:first-child { margin-top: 0; }
.markdown p { margin: 0 0 16px; }
.markdown ul, .markdown ol { margin: 0 0 16px; padding-left: 28px; }
.markdown li { margin: 4px 0; }
.markdown code { background: #f0f1f3; padding: 2px 6px; border-radius: 4px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; }
.markdown pre { background: #f6f8fa; border: 1px solid #e1e4e8; border-radius: 6px; padding: 16px; overflow-x: auto; margin: 0 0 16px; }
.markdown pre code { background: transparent; padding: 0; }
.markdown blockquote { border-left: 4px solid #d0d7de; margin: 0 0 16px; padding: 0 16px; color: #57606a; }
.markdown a { color: #0969da; }
.markdown table { border-collapse: collapse; margin: 0 0 16px; }
.markdown th, .markdown td { border: 1px solid #d0d7de; padding: 6px 12px; }
.markdown img { max-width: 100%; }
.markdown hr { border: 0; border-top: 1px solid #e1e4e8; margin: 24px 0; }
.markdown del { color: #57606a; }
.markdown img { max-width: 100%; height: auto; border-radius: 6px; margin: 8px 0; }
.markdown .task-list { list-style: none; padding-left: 4px; }
.markdown .task-list li { display: flex; align-items: flex-start; gap: 8px; margin: 6px 0; }
.markdown .task-list input[type="checkbox"] { margin-top: 5px; accent-color: #0969da; flex-shrink: 0; }
.markdown .footnotes { margin-top: 32px; padding-top: 16px; border-top: 1px solid #e1e4e8; font-size: 14px; color: #57606a; }
.markdown .footnotes h2 { font-size: 16px; margin-bottom: 8px; }
.markdown .footnotes ol { padding-left: 24px; }
.markdown .footnotes li { margin: 4px 0; }
.markdown .footnote-ref { font-size: 12px; vertical-align: super; color: #0969da; text-decoration: none; }
.markdown .footnote-ref:hover { text-decoration: underline; }
.markdown .mermaid { background: #f6f8fa; border: 1px solid #e1e4e8; border-radius: 8px; padding: 16px; margin: 0 0 16px; text-align: center; overflow-x: auto; }
.markdown .mermaid svg { max-width: 100%; }
.markdown .mermaid-error { color: #cf222e; background: #ffebe9; border-color: #ffcecb; text-align: left; white-space: pre-wrap; }
.menu-btn { display: none; position: fixed; top: 14px; left: 14px; z-index: 5; width: 42px; height: 42px; border: 1px solid #d0d7de; border-radius: 8px; background: #fff; color: #24292f; font-size: 22px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
.sidebar-overlay { display: none; position: fixed; inset: 0; z-index: 3; background: rgba(31,35,40,.36); }
body.sidebar-closed .sidebar { display: none; }
body.sidebar-closed .menu-btn { display: block; }
body.sidebar-closed .main { padding: 72px 40px 32px 88px; }
@media (max-width: 1023px) {
body { display: block; }
.menu-btn { display: block; }
.sidebar { position: fixed; top: 0; left: 0; z-index: 4; width: min(320px, 86vw); transform: translateX(-100%); transition: transform .22s ease; box-shadow: 8px 0 24px rgba(31,35,40,.18); }
body.sidebar-closed .sidebar { display: flex; }
body.sidebar-open .sidebar { transform: translateX(0); }
body.sidebar-open .sidebar-overlay { display: block; }
body.sidebar-open .menu-btn { display: none; }
.main { min-height: 100vh; padding: 72px 18px 28px; }
.markdown { padding: 24px 20px; }
}
</style>
</head>
<body>
<button class="menu-btn" id="menuBtn" type="button" aria-label="Open sidebar">☰</button>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<aside class="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-title-row">
      <h1>📄 MD Reader</h1>
      <button class="sidebar-close-btn" id="sidebarCloseBtn" type="button" aria-label="Close sidebar">☰</button>
    </div>
    <div class="open-actions">
      <button class="open-btn" id="openBtn">📂 Folder</button>
      <input class="file-input" id="fileInput" type="file" accept=".md,text/markdown,text/plain" multiple webkitdirectory>
      <button class="open-btn open-file-btn" id="openFileBtn">📄 File</button>
      <input class="file-input" id="singleFileInput" type="file" accept=".md,text/markdown,text/plain" multiple>
    </div>
    <input class="search-input" id="searchInput" type="search" placeholder="Search file name..." aria-label="Search markdown files">
    <div class="current-path" id="currentPath"></div>
  </div>
  <ul class="tree" id="tree"></ul>
  <div class="developer-credit">Developed By C&amp;H</div>
</aside>
<main class="main" id="main">
  <div class="empty">
    <p>Click <strong>Open Folder</strong> and pick a folder to browse its <code>.md</code> files.</p>
    <p class="hint">Works best in Chrome or Edge. Files are read directly from disk in your browser — nothing is uploaded.</p>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
'use strict';

const openBtn = document.getElementById('openBtn');
const openFileBtn = document.getElementById('openFileBtn');
const menuBtn = document.getElementById('menuBtn');
const sidebarCloseBtn = document.getElementById('sidebarCloseBtn');
const sidebarOverlay = document.getElementById('sidebarOverlay');
const fileInput = document.getElementById('fileInput');
const singleFileInput = document.getElementById('singleFileInput');
const searchInput = document.getElementById('searchInput');
const treeEl = document.getElementById('tree');
const mainEl = document.getElementById('main');
const pathEl = document.getElementById('currentPath');

let dirHandle = null;
let roots = []; // { id, name, files, collapsed }
let nextRootId = 1;
let selectedRootId = null;
let selectedFileRel = '';
let draggedRootId = null;
let mermaidInitialized = false;

menuBtn.addEventListener('click', () => {
  if (isDrawerMode()) {
    document.body.classList.toggle('sidebar-open');
  } else {
    document.body.classList.toggle('sidebar-closed');
  }
  updateMenuButtonLabel();
});

sidebarCloseBtn.addEventListener('click', closeSidebar);
sidebarOverlay.addEventListener('click', closeSidebar);

openBtn.addEventListener('click', async () => {
  if (!('showDirectoryPicker' in window)) {
    fileInput.value = '';
    fileInput.click();
    return;
  }
  try {
    dirHandle = await window.showDirectoryPicker({ mode: 'read' });
    renderLoading('Reading files...');
    const files = [];
    await walk(dirHandle, '', files);
    if (files.length === 0) {
      renderEmpty('<div class="empty">No <code>.md</code> files found in this folder.</div>');
    } else {
      addRoot(dirHandle.name, files);
      renderTree();
      renderEmpty('<div class="empty">Select a markdown file from the sidebar to read it.</div>');
    }
  } catch (e) {
    if (e.name !== 'AbortError') {
      renderEmpty('<div class="error">Could not open folder: ' + escapeHtml(String(e)) + '</div>');
    }
  }
});

fileInput.addEventListener('change', () => {
  renderLoading('Reading files...');
  requestAnimationFrame(readSelectedFiles);
});

openFileBtn.addEventListener('click', () => {
  singleFileInput.value = '';
  singleFileInput.click();
});

singleFileInput.addEventListener('change', () => {
  renderLoading('Reading files...');
  requestAnimationFrame(readChosenFiles);
});

function readSelectedFiles() {
  const files = Array.from(fileInput.files || []);
  const markdownFiles = files
    .filter(file => file.name.toLowerCase().endsWith('.md'))
    .map(file => ({
      file,
      rel: file.webkitRelativePath || file.name
    }));
  dirHandle = null;
    if (markdownFiles.length > 0) {
    addRoot('Selected files', markdownFiles);
  }
  renderTree();
  if (files.length === 0) {
    renderEmpty('<div class="empty">Click <strong>Open Folder</strong> and pick a folder to browse its <code>.md</code> files.</div>');
  } else if (markdownFiles.length === 0) {
    renderEmpty('<div class="empty">No <code>.md</code> files found in the selected files.</div>');
  } else {
    renderEmpty('<div class="empty">Select a markdown file from the sidebar to read it.</div>');
  }
}

function readChosenFiles() {
  const files = Array.from(singleFileInput.files || []);
  const markdownFiles = files
    .filter(file => file.name.toLowerCase().endsWith('.md'))
    .map(file => ({ file, rel: file.name }));

  if (markdownFiles.length === 1) {
    addSingleFile(markdownFiles[0]);
  } else if (markdownFiles.length > 1) {
    addRoot(markdownFiles.length === 1 ? markdownFiles[0].rel : 'Selected files', markdownFiles);
  }
  renderTree();
  if (files.length === 0) {
    renderEmpty('<div class="empty">Click <strong>Open File</strong> and choose one or more <code>.md</code> files.</div>');
  } else if (markdownFiles.length === 0) {
    renderEmpty('<div class="empty">No <code>.md</code> files found in the selected files.</div>');
  } else {
    renderEmpty('<div class="empty">Select a markdown file from the sidebar to read it.</div>');
  }
}

searchInput.addEventListener('input', renderTree);

async function walk(handle, prefix, files) {
  for await (const entry of handle.values()) {
    if (entry.kind === 'directory') {
      await walk(entry, prefix ? prefix + '/' + entry.name : entry.name, files);
    } else if (entry.name.toLowerCase().endsWith('.md')) {
      files.push({ handle: entry, rel: prefix ? prefix + '/' + entry.name : entry.name });
    }
  }
}

function renderTree() {
  const searchTerm = searchInput.value.trim().toLowerCase();
  treeEl.innerHTML = '';

  let totalFiles = 0;
  let totalVisibleFiles = 0;
  for (const root of roots) {
    root.files.sort((a, b) => a.rel.localeCompare(b.rel, undefined, { numeric: true }));
    const visibleFiles = searchTerm
      ? root.files.filter(f => f.rel.toLowerCase().includes(searchTerm))
      : root.files;

    totalFiles += root.files.length;
    totalVisibleFiles += visibleFiles.length;
    if (visibleFiles.length > 0 || !searchTerm) {
      buildRoot(root, visibleFiles, treeEl);
    }
  }

  if (totalFiles > 0 && totalVisibleFiles === 0) {
    treeEl.innerHTML = '<li class="empty">No matching files found.</li>';
  }
}

function addRoot(name, files) {
  const id = nextRootId++;
  roots.push({
    id,
    name,
    files: files.map(file => ({ ...file, rootId: id })),
    collapsed: false
  });
  pathEl.style.display = 'none';
}

function addSingleFile(file) {
  const id = nextRootId++;
  roots.push({
    id,
    name: file.rel,
    files: [{ ...file, rootId: id }],
    collapsed: false,
    singleFile: true
  });
  pathEl.style.display = 'none';
}

function buildRoot(root, files, parentUl) {
  if (root.singleFile) {
    buildSingleFileRoot(root, files[0], parentUl);
    return;
  }

  const li = document.createElement('li');
  li.className = 'root-item';
  li.dataset.rootId = String(root.id);
  const row = document.createElement('div');
  row.className = 'root-row';
  row.dataset.rootId = String(root.id);
  row.draggable = true;
  row.classList.toggle('selected', root.id === selectedRootId);

  const toggle = document.createElement('span');
  toggle.className = 'root-toggle';
  toggle.textContent = '📁 ' + root.name;
  toggle.classList.toggle('collapsed', root.collapsed);

  const removeBtn = document.createElement('button');
  removeBtn.className = 'remove-root';
  removeBtn.type = 'button';
  removeBtn.textContent = '×';
  removeBtn.setAttribute('aria-label', 'Remove selected folder');

  const ul = document.createElement('ul');
  ul.className = 'children';
  ul.classList.toggle('collapsed', root.collapsed);
  buildUl(buildFileTree(files), ul, root.id);

  toggle.addEventListener('click', () => {
    root.collapsed = !root.collapsed;
    toggle.classList.toggle('collapsed', root.collapsed);
    ul.classList.toggle('collapsed', root.collapsed);
  });

  removeBtn.addEventListener('click', () => {
    roots = roots.filter(item => item.id !== root.id);
    if (selectedRootId === root.id) selectedRootId = null;
    if (selectedRootId === null) selectedFileRel = '';
    renderTree();
    if (roots.length === 0) {
      dirHandle = null;
      fileInput.value = '';
      singleFileInput.value = '';
      searchInput.value = '';
      selectedRootId = null;
      selectedFileRel = '';
      renderEmpty('<div class="empty"><p>Click <strong>Open Folder</strong> and pick a folder to browse its <code>.md</code> files.</p><p class="hint">Works best in Chrome or Edge. Files are read directly from disk in your browser — nothing is uploaded.</p></div>');
    }
  });

  row.appendChild(toggle);
  row.appendChild(removeBtn);
  li.appendChild(row);
  li.appendChild(ul);
  enableRootDrag(row, li, root.id);
  parentUl.appendChild(li);
}

function buildSingleFileRoot(root, entry, parentUl) {
  if (!entry) return;

  const li = document.createElement('li');
  li.className = 'root-item';
  li.dataset.rootId = String(root.id);
  const row = document.createElement('div');
  row.className = 'root-row single-file-row';
  row.dataset.rootId = String(root.id);
  row.draggable = true;
  row.classList.toggle('selected', root.id === selectedRootId);

  const link = document.createElement('a');
  link.textContent = '📄 ' + entry.rel;
  link.dataset.rel = entry.rel;
  link.dataset.rootId = String(entry.rootId);
  link.classList.toggle('active', entry.rootId === selectedRootId && entry.rel === selectedFileRel);
  link.addEventListener('click', () => openFile(entry));

  const removeBtn = document.createElement('button');
  removeBtn.className = 'remove-root';
  removeBtn.type = 'button';
  removeBtn.textContent = '×';
  removeBtn.setAttribute('aria-label', 'Remove selected file');
  removeBtn.addEventListener('click', () => {
    roots = roots.filter(item => item.id !== root.id);
    if (selectedRootId === root.id) {
      selectedRootId = null;
      selectedFileRel = '';
    }
    renderTree();
    if (roots.length === 0) {
      dirHandle = null;
      fileInput.value = '';
      singleFileInput.value = '';
      searchInput.value = '';
      renderEmpty('<div class="empty"><p>Click <strong>Open Folder</strong> and pick a folder to browse its <code>.md</code> files.</p><p class="hint">Works best in Chrome or Edge. Files are read directly from disk in your browser — nothing is uploaded.</p></div>');
    }
  });

  row.appendChild(link);
  row.appendChild(removeBtn);
  li.appendChild(row);
  enableRootDrag(row, li, root.id);
  parentUl.appendChild(li);
}

function enableRootDrag(handle, item, rootId) {
  handle.addEventListener('dragstart', event => {
    draggedRootId = rootId;
    item.classList.add('dragging');
    event.dataTransfer.effectAllowed = 'move';
    event.dataTransfer.setData('text/plain', String(rootId));
  });

  item.addEventListener('dragover', event => {
    if (draggedRootId === null || draggedRootId === rootId) return;
    event.preventDefault();
    const rect = item.getBoundingClientRect();
    const isAfter = event.clientY > rect.top + rect.height / 2;
    item.classList.toggle('drop-before', !isAfter);
    item.classList.toggle('drop-after', isAfter);
  });

  item.addEventListener('dragleave', () => {
    item.classList.remove('drop-before', 'drop-after');
  });

  item.addEventListener('drop', event => {
    event.preventDefault();
    const insertAfter = item.classList.contains('drop-after');
    item.classList.remove('drop-before', 'drop-after');
    moveRoot(draggedRootId, rootId, insertAfter);
    draggedRootId = null;
  });

  handle.addEventListener('dragend', () => {
    draggedRootId = null;
    document.querySelectorAll('.root-item').forEach(rootItem => rootItem.classList.remove('dragging', 'drop-before', 'drop-after'));
  });
}

function moveRoot(fromId, toId, insertAfter) {
  if (fromId === null || fromId === toId) return;

  const fromIndex = roots.findIndex(root => root.id === fromId);
  const toIndex = roots.findIndex(root => root.id === toId);
  if (fromIndex === -1 || toIndex === -1) return;

  const [root] = roots.splice(fromIndex, 1);
  const adjustedToIndex = roots.findIndex(item => item.id === toId);
  roots.splice(insertAfter ? adjustedToIndex + 1 : adjustedToIndex, 0, root);
  renderTree();
}

function buildFileTree(files) {
  const root = {};
  for (const f of files) {
    const parts = f.rel.split('/');
    let node = root;
    for (let i = 0; i < parts.length - 1; i++) {
      if (!node[parts[i]]) node[parts[i]] = {};
      node = node[parts[i]];
    }
    node[parts[parts.length - 1]] = f;
  }
  return root;
}

function buildUl(obj, parentUl, rootId, prefix = '') {
  const keys = Object.keys(obj).sort((a, b) => {
    const aDir = typeof obj[a].handle === 'undefined';
    const bDir = typeof obj[b].handle === 'undefined';
    if (aDir !== bDir) return aDir ? -1 : 1;
    return a.localeCompare(b, undefined, { numeric: true });
  });
  for (const name of keys) {
    const entry = obj[name];
    const li = document.createElement('li');
    if (!entry.handle && !entry.file) {
      const folderPath = prefix ? prefix + '/' + name : name;
      const folder = document.createElement('div');
      folder.className = 'folder';
      folder.dataset.rootId = String(rootId);
      folder.dataset.path = folderPath;
      folder.classList.toggle('selected-parent', rootId === selectedRootId && selectedFileRel.startsWith(folderPath + '/'));
      folder.textContent = '📁 ' + name;
      li.appendChild(folder);
      const ul = document.createElement('ul');
      ul.className = 'children';
      buildUl(entry, ul, rootId, folderPath);
      li.appendChild(ul);
      folder.addEventListener('click', () => {
        folder.classList.toggle('collapsed');
        ul.classList.toggle('collapsed');
      });
    } else {
      const a = document.createElement('a');
      a.textContent = '📄 ' + name;
      a.dataset.rel = entry.rel;
      a.dataset.rootId = String(entry.rootId);
      a.addEventListener('click', () => openFile(entry));
      li.appendChild(a);
    }
    parentUl.appendChild(li);
  }
}

async function openFile(entry) {
  mainEl.innerHTML = '<div class="loading"><span class="spinner" aria-hidden="true"></span><span>Reading file...</span></div>';
  const file = entry.file || await entry.handle.getFile();
  const text = await file.text();
  selectedRootId = entry.rootId;
  selectedFileRel = entry.rel;
  document.querySelectorAll('.tree a').forEach(a => a.classList.remove('active'));
  document.querySelectorAll('.tree .folder').forEach(folder => folder.classList.remove('selected-parent'));
  document.querySelectorAll('.tree .root-row').forEach(row => row.classList.toggle('selected', row.dataset.rootId === String(selectedRootId)));
  const link = Array.from(document.querySelectorAll('.tree a')).find(a => a.dataset.rel === entry.rel && a.dataset.rootId === String(entry.rootId));
  if (link) {
    link.classList.add('active');
    let parent = link.parentElement;
    while (parent && parent !== treeEl) {
      if (parent.classList.contains('children')) {
        const folder = parent.previousElementSibling;
        if (folder && folder.classList.contains('folder')) folder.classList.add('selected-parent');
      }
      parent = parent.parentElement;
    }
  }

  mainEl.innerHTML = '<article class="markdown">' + renderMarkdown(text) + '</article>';
  await renderMermaidDiagrams();
  // Keep the file tree visible on desktop; only dismiss the mobile drawer.
  if (isDrawerMode()) closeSidebar();
}

async function renderMermaidDiagrams() {
  const nodes = Array.from(document.querySelectorAll('.markdown .mermaid'));
  if (nodes.length === 0) return;

  if (typeof window.mermaid === 'undefined') {
    nodes.forEach(node => {
      node.classList.add('mermaid-error');
      node.textContent = 'Mermaid could not be loaded. Check your internet connection and reload the page.\n\n' + node.textContent;
    });
    return;
  }

  if (!mermaidInitialized) {
    window.mermaid.initialize({
      startOnLoad: false,
      theme: 'default'
    });
    mermaidInitialized = true;
  }

  // Render separately so one invalid diagram does not prevent the others.
  for (const node of nodes) {
    const source = node.textContent;
    try {
      node.removeAttribute('data-processed');
      await window.mermaid.run({ nodes: [node] });
    } catch (error) {
      node.removeAttribute('data-processed');
      node.classList.add('mermaid-error');
      node.textContent = 'Mermaid diagram error: ' + (error.message || String(error)) + '\n\n' + source;
    }
  }
}

function closeSidebar() {
  if (isDrawerMode()) {
    document.body.classList.remove('sidebar-open');
  } else {
    document.body.classList.add('sidebar-closed');
  }
  updateMenuButtonLabel();
}

function isDrawerMode() {
  return window.matchMedia('(max-width: 1023px)').matches;
}

function updateMenuButtonLabel() {
  const isOpen = isDrawerMode()
    ? document.body.classList.contains('sidebar-open')
    : !document.body.classList.contains('sidebar-closed');
  menuBtn.setAttribute('aria-label', isOpen ? 'Close sidebar' : 'Open sidebar');
}

/* ---- lightweight markdown renderer ---- */
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function closeList(listType) {
  return listType && listType !== 'task' ? '</' + listType + '>' : listType === 'task' ? '</ul>' : '';
}

function renderInline(text) {
  text = escapeHtml(text);
  // Escaped characters: pull them aside so later patterns don't process them
  const esc = [];
  text = text.replace(/\\([\\`*_~\[\]#+\-.!<>()|])/g, (m, c) => {
    esc.push(c);
    return '\u0000' + (esc.length - 1) + '\u0000';
  });
  // Inline code (before other inline markup)
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Images (must run before links): ![alt](url), optional title
  text = text.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)/g, '<img src="$2" alt="$1" title="$3">');
  // Footnote references: [^n]
  text = text.replace(/\[\^([^\]]+)\](?!\s*:)/g, '<a class="footnote-ref" href="#fn-$1" id="fnref-$1">$1</a>');
  // Bold
  text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  // Strikethrough
  text = text.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  // Italic
  text = text.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  // Links
  text = text.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>');
  // Restore escaped characters
  text = text.replace(/\u0000(\d+)\u0000/g, (m, i) => esc[+i] === '\\' ? '&#92;' : esc[+i]);
  return text;
}

function normalizeMermaidSource(source) {
  const firstLine = source.split('\n').find(line => line.trim() !== '') || '';
  if (!/^erDiagram\b/i.test(firstLine.trim())) return source;

  // Mermaid requires combined ER attribute keys to be comma-separated:
  // `bigint user_id PK FK` -> `bigint user_id PK, FK`.
  return source.replace(/\b(PK|FK|UK)(?:\s+(PK|FK|UK))+/g, match =>
    match.trim().split(/\s+/).join(', ')
  );
}

function renderMarkdown(md) {
  md = md.replace(/\r\n|\r/g, '\n');

  // Also support files that contain Mermaid source directly, without a
  // ```mermaid fence. This is useful for exported ERD files whose first
  // meaningful line is `erDiagram`.
  const firstMeaningfulLine = md.split('\n').find(line => line.trim() !== '');
  if (firstMeaningfulLine && /^(?:erDiagram|flowchart|graph|sequenceDiagram|classDiagram|stateDiagram(?:-v2)?|journey|gantt|pie|gitGraph|mindmap|timeline|quadrantChart|xychart-beta|sankey-beta|block-beta|packet-beta|architecture-beta)\b/i.test(firstMeaningfulLine.trim())) {
    return '<div class="mermaid">' + escapeHtml(normalizeMermaidSource(md)) + '</div>\n';
  }

  const lines = md.split('\n');
  let html = '';
  let inCode = false;
  let codeLines = [];
  let listType = null;
  let inQuote = false;
  let footnotes = {};
  let footnoteKeys = [];
  let currentLang = '';

  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i];
    const line = raw.trim();

    if (/^```/.test(line)) {
      if (inCode) {
        const lang = currentLang || '';
        const isMermaid = lang.trim().toLowerCase() === 'mermaid';
        if (isMermaid) {
          html += '<div class="mermaid">' + escapeHtml(normalizeMermaidSource(codeLines.join('\n'))) + '</div>\n';
        } else {
          html += '<pre><code>' + escapeHtml(codeLines.join('\n')) + '</code></pre>\n';
        }
        codeLines = [];
        currentLang = '';
        inCode = false;
      } else {
        currentLang = line.replace(/^```/, '').trim();
        inCode = true;
      }
      continue;
    }
    if (inCode) {
      codeLines.push(raw);
      continue;
    }
    // Embedded HTML block passthrough (e.g. <div>, <details>, custom tags)
    if (/^\s*<\/?[a-zA-Z][^>]*>\s*$/.test(line)) {
      if (listType) { html += closeList(listType) + '\n'; listType = null; }
      if (inQuote) { html += '</blockquote>\n'; inQuote = false; }
      html += raw + '\n';
      continue;
    }
    if (line === '') {
      if (listType) { html += closeList(listType) + '\n'; listType = null; }
      if (inQuote) { html += '</blockquote>\n'; inQuote = false; }
      continue;
    }

    let m;
    if ((m = line.match(/^\[\^([^\]]+)\]:\s*(.+)$/))) {
      const key = m[1];
      footnotes[key] = m[2];
      footnoteKeys.push(key);
      continue;
    }
    if ((m = line.match(/^(#{1,6})\s+(.*)$/))) {
      closeBlocks();
      html += '<h' + m[1].length + '>' + renderInline(m[2]) + '</h' + m[1].length + '>\n';
      continue;
    }
    if (/^(-{3,}|\*{3,}|_{3,})$/.test(line)) {
      closeBlocks();
      html += '<hr>\n';
      continue;
    }
    if (isTableHeader(line, lines[i + 1])) {
      closeBlocks();
      const headers = parseTableRow(line);
      const rows = [];
      i += 2;
      while (i < lines.length && isTableRow(lines[i].trim())) {
        rows.push(parseTableRow(lines[i].trim()));
        i++;
      }
      i--;
      html += renderTable(headers, rows);
      continue;
    }
    if ((m = line.match(/^>\s?(.*)$/))) {
      if (!inQuote) { html += '<blockquote>\n'; inQuote = true; }
      html += '<p>' + renderInline(m[1]) + '</p>\n';
      continue;
    }
    // Task lists (before regular lists)
    if ((m = line.match(/^[-*+]\s+\[([ xX])\]\s+(.*)$/))) {
      if (listType && listType !== 'task') { html += closeList(listType); listType = null; }
      if (listType !== 'task') { html += '<ul class="task-list">\n'; listType = 'task'; }
      const checked = m[1].toLowerCase() === 'x' ? ' checked' : '';
      html += '<li><input type="checkbox"' + checked + ' disabled><span>' + renderInline(m[2]) + '</span></li>\n';
      continue;
    }
    if ((m = line.match(/^[-*+]\s+(.*)$/))) {
      if (listType && listType !== 'ul') { html += closeList(listType); listType = null; }
      if (listType !== 'ul') { html += '<ul>\n'; listType = 'ul'; }
      html += '<li>' + renderInline(m[1]) + '</li>\n';
      continue;
    }
    if ((m = line.match(/^\d+[.)]\s+(.*)$/))) {
      if (listType && listType !== 'ol') { html += closeList(listType); listType = null; }
      if (listType !== 'ol') { html += '<ol>\n'; listType = 'ol'; }
      html += '<li>' + renderInline(m[1]) + '</li>\n';
      continue;
    }

    closeBlocks();
    html += '<p>' + renderInline(line) + '</p>\n';
  }

  if (inCode) {
    const lang = currentLang || '';
    if (lang.trim().toLowerCase() === 'mermaid') {
      html += '<div class="mermaid">' + escapeHtml(normalizeMermaidSource(codeLines.join('\n'))) + '</div>\n';
    } else {
      html += '<pre><code>' + escapeHtml(codeLines.join('\n')) + '</code></pre>\n';
    }
  }
  if (listType) html += closeList(listType) + '\n';
  if (inQuote) html += '</blockquote>\n';

  // Render footnotes section
  if (footnoteKeys.length > 0) {
    html += '<div class="footnotes"><h2>Footnotes</h2><ol>\n';
    for (const key of footnoteKeys) {
      html += '<li id="fn-' + key + '">' + renderInline(footnotes[key]) + ' <a href="#fnref-' + key + '" class="footnote-ref">&#8617;</a></li>\n';
    }
    html += '</ol></div>\n';
  }

  return html;

  function closeBlocks() {
    if (listType) { html += '</' + listType + '>\n'; listType = null; }
    if (inQuote) { html += '</blockquote>\n'; inQuote = false; }
  }
}

function isTableHeader(line, nextLine) {
  return isTableRow(line) && typeof nextLine === 'string' && isTableDelimiter(nextLine.trim());
}

function isTableRow(line) {
  return line.includes('|') && parseTableRow(line).length > 1;
}

function isTableDelimiter(line) {
  if (!isTableRow(line)) return false;
  return parseTableRow(line).every(cell => /^:?-{3,}:?$/.test(cell));
}

function parseTableRow(line) {
  return line.replace(/^\|/, '').replace(/\|$/, '').split('|').map(cell => cell.trim());
}

function renderTable(headers, rows) {
  let html = '<table>\n<thead><tr>';
  for (const header of headers) {
    html += '<th>' + renderInline(header) + '</th>';
  }
  html += '</tr></thead>\n<tbody>\n';
  for (const row of rows) {
    html += '<tr>';
    for (let i = 0; i < headers.length; i++) {
      html += '<td>' + renderInline(row[i] || '') + '</td>';
    }
    html += '</tr>\n';
  }
  html += '</tbody>\n</table>\n';
  return html;
}

function renderEmpty(htmlContent) {
  mainEl.innerHTML = htmlContent;
}

function renderLoading(message) {
  mainEl.innerHTML = '<div class="loading"><span class="spinner" aria-hidden="true"></span><span>' + escapeHtml(message) + '</span></div>';
}

</script>
</body>
</html>
