<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD Reader</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; height: 100vh; background: #f5f6f8; color: #24292f; }
.sidebar { width: 320px; background: #fff; border-right: 1px solid #e1e4e8; overflow-y: auto; padding: 20px 16px; flex-shrink: 0; display: flex; flex-direction: column; }
.sidebar h1 { font-size: 18px; margin-bottom: 12px; color: #24292f; }
.open-btn { width: 100%; padding: 10px; background: #0969da; color: #fff; border: 0; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 12px; }
.open-btn:hover { background: #0b5fbf; }
.search-input { width: 100%; padding: 9px 10px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 14px; margin-bottom: 12px; outline: none; }
.search-input:focus { border-color: #0969da; box-shadow: 0 0 0 3px rgba(9,105,218,.12); }
.current-path { font-size: 11px; color: #57606a; word-break: break-all; margin-bottom: 12px; padding: 6px 8px; background: #f6f8fa; border-radius: 6px; display: none; }
.tree { list-style: none; }
.tree li { margin: 2px 0; }
.tree a { color: #24292f; text-decoration: none; font-size: 14px; display: block; padding: 4px 8px; border-radius: 6px; cursor: pointer; }
.tree a:hover { background: #f0f1f3; }
.tree a.active { background: #0969da; color: #fff; }
.tree .folder { font-weight: 600; padding: 4px 8px; color: #57606a; font-size: 13px; text-transform: uppercase; letter-spacing: .03em; user-select: none; }
.tree .children { list-style: none; padding-left: 14px; border-left: 1px solid #e1e4e8; margin-left: 10px; }
.tree .file-icon { opacity: .7; margin-right: 4px; }
.main { flex: 1; overflow-y: auto; padding: 32px 40px; }
.empty { color: #57606a; font-size: 16px; max-width: 600px; }
.error { color: #cf222e; background: #ffebe9; border: 1px solid #ffcecb; padding: 12px 16px; border-radius: 6px; font-size: 14px; word-break: break-all; }
.hint { font-size: 13px; color: #57606a; margin-top: 12px; line-height: 1.6; }
.markdown { background: #fff; border: 1px solid #e1e4e8; border-radius: 8px; padding: 32px 40px; max-width: 860px; box-shadow: 0 1px 3px rgba(0,0,0,.04); line-height: 1.7; }
.markdown h1, .markdown h2, .markdown h3, .markdown h4 { margin: 28px 0 14px; line-height: 1.25; }
.markdown h1:first-child { margin-top: 0; }
.markdown p { margin: 0 0 16px; }
.markdown ul, .markdown ol { margin: 0 0 16px; padding-left: 28px; }
.markdown li { margin: 4px 0; }
.markdown code { background: #f0f1f3; padding: 2px 6px; border-radius: 4px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; }
.markdown pre { background: #f6f8fa; border: 1px solid #e1e4e8; border-radius: 6px; padding: 16px; overflow-x: auto; margin: 0 0 16px; }
.markdown pre code { background: transparent; padding: 0; }
.markdown blockquote { border-left: 4px solid #d0d7de; margin: 0 0 16px; padding: 0 16px; color: #57606a; }
.markdown a { color: #0969da; }
.markdown table { border-collapse: collapse; margin: 0 0 16px; }
.markdown th, .markdown td { border: 1px solid #d0d7de; padding: 6px 12px; }
.markdown img { max-width: 100%; }
.markdown hr { border: 0; border-top: 1px solid #e1e4e8; margin: 24px 0; }
</style>
</head>
<body>
<aside class="sidebar">
  <h1>📄 MD Reader</h1>
  <button class="open-btn" id="openBtn">📂 Open Folder</button>
  <input class="search-input" id="searchInput" type="search" placeholder="Search file name..." aria-label="Search markdown files">
  <div class="current-path" id="currentPath"></div>
  <ul class="tree" id="tree"></ul>
</aside>
<main class="main" id="main">
  <div class="empty">
    <p>Click <strong>Open Folder</strong> and pick a folder to browse its <code>.md</code> files.</p>
    <p class="hint">Works best in Chrome or Edge. Files are read directly from disk in your browser — nothing is uploaded.</p>
  </div>
</main>
<script>
'use strict';

const openBtn = document.getElementById('openBtn');
const searchInput = document.getElementById('searchInput');
const treeEl = document.getElementById('tree');
const mainEl = document.getElementById('main');
const pathEl = document.getElementById('currentPath');

let dirHandle = null;
let mdFiles = []; // { handle, rel }

openBtn.addEventListener('click', async () => {
  if (!('showDirectoryPicker' in window)) {
    renderEmpty('<div class="error">This browser doesn\'t support folder selection. Please use Chrome or Edge.</div>');
    return;
  }
  try {
    dirHandle = await window.showDirectoryPicker({ mode: 'read' });
    mdFiles = [];
    await walk(dirHandle, '');
    pathEl.textContent = '📁 ' + dirHandle.name;
    pathEl.style.display = 'block';
    renderTree();
    if (mdFiles.length === 0) {
      renderEmpty('<div class="empty">No <code>.md</code> files found in this folder.</div>');
    }
  } catch (e) {
    if (e.name !== 'AbortError') {
      renderEmpty('<div class="error">Could not open folder: ' + escapeHtml(String(e)) + '</div>');
    }
  }
});

searchInput.addEventListener('input', renderTree);

async function walk(handle, prefix) {
  for await (const entry of handle.values()) {
    if (entry.kind === 'directory') {
      await walk(entry, prefix ? prefix + '/' + entry.name : entry.name);
    } else if (entry.name.toLowerCase().endsWith('.md')) {
      mdFiles.push({ handle: entry, rel: prefix ? prefix + '/' + entry.name : entry.name });
    }
  }
}

function renderTree() {
  mdFiles.sort((a, b) => a.rel.localeCompare(b.rel, undefined, { numeric: true }));
  const searchTerm = searchInput.value.trim().toLowerCase();
  const visibleFiles = searchTerm
    ? mdFiles.filter(f => f.rel.toLowerCase().includes(searchTerm))
    : mdFiles;

  const root = {};
  for (const f of visibleFiles) {
    const parts = f.rel.split('/');
    let node = root;
    for (let i = 0; i < parts.length - 1; i++) {
      if (!node[parts[i]]) node[parts[i]] = {};
      node = node[parts[i]];
    }
    node[parts[parts.length - 1]] = f;
  }

  treeEl.innerHTML = '';
  buildUl(root, treeEl);
  if (mdFiles.length > 0 && visibleFiles.length === 0) {
    treeEl.innerHTML = '<li class="empty">No matching files found.</li>';
  }
}

function buildUl(obj, parentUl) {
  const keys = Object.keys(obj).sort((a, b) => {
    const aDir = typeof obj[a].handle === 'undefined';
    const bDir = typeof obj[b].handle === 'undefined';
    if (aDir !== bDir) return aDir ? -1 : 1;
    return a.localeCompare(b, undefined, { numeric: true });
  });
  for (const name of keys) {
    const entry = obj[name];
    const li = document.createElement('li');
    if (typeof entry.handle === 'undefined') {
      const folder = document.createElement('div');
      folder.className = 'folder';
      folder.textContent = '📁 ' + name;
      li.appendChild(folder);
      const ul = document.createElement('ul');
      ul.className = 'children';
      buildUl(entry, ul);
      li.appendChild(ul);
    } else {
      const a = document.createElement('a');
      a.textContent = '📄 ' + name;
      a.dataset.rel = entry.rel;
      a.addEventListener('click', () => openFile(entry.handle));
      li.appendChild(a);
    }
    parentUl.appendChild(li);
  }
}

async function openFile(handle) {
  if (typeof handle.getFile !== 'function') return;
  const file = await handle.getFile();
  const text = await file.text();
  document.querySelectorAll('.tree a').forEach(a => a.classList.remove('active'));
  const link = Array.from(document.querySelectorAll('.tree a')).find(a => a.dataset.rel === mdRel(handle));
  if (link) link.classList.add('active');

  const root = document.getElementById('currentPath');
  mainEl.innerHTML = '<article class="markdown">' + renderMarkdown(text) + '</article>';
}

function mdRel(handle) {
  for (const f of mdFiles) if (f.handle === handle) return f.rel;
  return '';
}

/* ---- lightweight markdown renderer ---- */
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderInline(text) {
  text = escapeHtml(text);
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  text = text.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>');
  return text;
}

function renderMarkdown(md) {
  md = md.replace(/\r\n|\r/g, '\n');
  const lines = md.split('\n');
  let html = '';
  let inCode = false;
  let codeLines = [];
  let listType = null;
  let inQuote = false;

  for (const raw of lines) {
    const line = raw.trim();

    if (/^```/.test(line)) {
      if (inCode) {
        html += '<pre><code>' + codeLines.join('\n') + '</code></pre>\n';
        codeLines = [];
        inCode = false;
      } else {
        inCode = true;
      }
      continue;
    }
    if (inCode) {
      codeLines.push(escapeHtml(raw));
      continue;
    }
    if (line === '') {
      if (listType) { html += '</' + listType + '>\n'; listType = null; }
      if (inQuote) { html += '</blockquote>\n'; inQuote = false; }
      continue;
    }

    let m;
    if ((m = line.match(/^(#{1,6})\s+(.*)$/))) {
      closeBlocks();
      html += '<h' + m[1].length + '>' + renderInline(m[2]) + '</h' + m[1].length + '>\n';
      continue;
    }
    if (/^(-{3,}|\*{3,}|_{3,})$/.test(line)) {
      closeBlocks();
      html += '<hr>\n';
      continue;
    }
    if ((m = line.match(/^&gt;\s?(.*)$/))) {
      if (!inQuote) { html += '<blockquote>\n'; inQuote = true; }
      html += '<p>' + renderInline(m[1]) + '</p>\n';
      continue;
    }
    if ((m = line.match(/^[-*+]\s+(.*)$/))) {
      if (listType && listType !== 'ul') { html += '</ol>\n'; listType = null; }
      if (listType !== 'ul') { html += '<ul>\n'; listType = 'ul'; }
      html += '<li>' + renderInline(m[1]) + '</li>\n';
      continue;
    }
    if ((m = line.match(/^\d+[.)]\s+(.*)$/))) {
      if (listType && listType !== 'ol') { html += '</ul>\n'; listType = null; }
      if (listType !== 'ol') { html += '<ol>\n'; listType = 'ol'; }
      html += '<li>' + renderInline(m[1]) + '</li>\n';
      continue;
    }

    closeBlocks();
    html += '<p>' + renderInline(line) + '</p>\n';
  }

  if (inCode) html += '<pre><code>' + codeLines.join('\n') + '</code></pre>\n';
  if (listType) html += '</' + listType + '>\n';
  if (inQuote) html += '</blockquote>\n';
  return html;

  function closeBlocks() {
    if (listType) { html += '</' + listType + '>\n'; listType = null; }
    if (inQuote) { html += '</blockquote>\n'; inQuote = false; }
  }
}

function renderEmpty(htmlContent) {
  mainEl.innerHTML = htmlContent;
}
</script>
</body>
</html>
